<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>NexusSphere Portal</title>
  <script>
    // Catch the PWA install prompt as early as possible
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      console.log('beforeinstallprompt fired and captured in index.html!');
      window.dispatchEvent(new Event('installPromptReady'));
    });
  </script>
</head>

<body>
  <canvas id="global-bg"></canvas>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <!-- Mobile Landscape Warning Overlay -->
  <div id="rotate-warning">
    <div class="icon">↺</div>
    <h2>Please Rotate Your Device</h2>
    <p>This experience is designed for landscape mode.</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
