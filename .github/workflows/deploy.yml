# GitHub Pages 배포를 위한 공식 워크플로우
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # 수동 실행 허용
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SCORE_SECRET: ${{ secrets.VITE_SCORE_SECRET }}
          VITE_ASSET_EXTERNAL_URL: ${{ secrets.VITE_ASSET_EXTERNAL_URL }}
          VITE_ASSET_VERSION: ${{ secrets.VITE_ASSET_VERSION }}
          NODE_ENV: production

      - name: List build output (Diagnostics)
        run: ls -R dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
