<!DOCTYPE html>
<html>
<head>
    <title>Nexussphere Audio Onset Analyzer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #00e5ff; }
        .drop-zone { border: 2px dashed #444; padding: 40px; text-align: center; cursor: pointer; transition: 0.3s; margin-bottom: 20px; }
        .drop-zone:hover { border-color: #00e5ff; background: #252525; }
        .results { background: #000; color: #0f0; padding: 15px; font-family: monospace; height: 300px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; }
        button { background: #00e5ff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #444; cursor: not-allowed; }
        .controls { margin-top: 10px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Precision Onset Analyzer</h1>
        <p>Drop your MP3 here to extract high-precision rhythmic timestamps for Nexussphere.</p>
        
        <div id="dropZone" class="drop-zone">
            Click or Drag & Drop MP3 File
            <input type="file" id="fileInput" accept="audio/*" style="display: none;">
        </div>

        <div class="controls">
            <button id="analyzeBtn" disabled>Analyze Waveform</button>
            <button id="copyBtn" disabled>Copy Timestamps</button>
        </div>

        <div id="status" style="margin: 10px 0; color: #aaa;">Status: Waiting for file...</div>
        
        <div id="results" class="results">Results will appear here...</div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resultsEl = document.getElementById('results');
        const statusEl = document.getElementById('status');

        let audioBuffer = null;

        dropZone.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        };

        async function handleFile(file) {
            statusEl.textContent = "Status: Loading file...";
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            try {
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                statusEl.textContent = `Status: Loaded "${file.name}" (${audioBuffer.duration.toFixed(2)}s)`;
                analyzeBtn.disabled = false;
            } catch (err) {
                statusEl.textContent = "Error: Failed to decode audio.";
                console.error(err);
            }
        }

        analyzeBtn.onclick = () => {
            if (!audioBuffer) return;
            statusEl.textContent = "Status: Analyzing waveform metrics...";
            
            // 1. Get PCM Data (Mono)
            const pcm = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            
            // 2. Metrics & Onset Detection
            const windowSize = 1024;
            const hopSize = 512;
            const onsets = [];
            const energyHistory = [];
            
            let maxPeak = 0;
            const threshold = 1.5; 

            for (let i = 0; i < pcm.length - windowSize; i += hopSize) {
                let energy = 0;
                for (let j = 0; j < windowSize; j++) {
                    const abs = Math.abs(pcm[i + j]);
                    if (abs > maxPeak) maxPeak = abs;
                    energy += pcm[i + j] * pcm[i + j];
                }
                energy = Math.sqrt(energy / windowSize);
                
                const avgEnergy = energyHistory.length > 0 
                    ? energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length 
                    : energy;
                
                if (energy > avgEnergy * threshold && energy > 0.05) {
                    const timestamp = i / sampleRate;
                    if (onsets.length === 0 || timestamp - onsets[onsets.length - 1] > 0.15) {
                        onsets.push(Number(timestamp.toFixed(4)));
                    }
                }
                
                energyHistory.push(energy);
                if (energyHistory.length > 10) energyHistory.shift();
            }

            const peakDb = 20 * Math.log10(maxPeak || 0.0001);
            const suggestedGain = maxPeak > 0 ? (0.707 / maxPeak).toFixed(2) : 1.0;

            resultsEl.textContent = `// --- Loudness Analysis ---\n// Peak: ${peakDb.toFixed(2)} dBFS\n// Suggested Volume: ${suggestedGain}\n\n` + JSON.stringify(onsets);
            statusEl.textContent = `Status: Found ${onsets.length} onsets. Peak at ${peakDb.toFixed(1)}dB.`;
            copyBtn.disabled = false;
        };

        copyBtn.onclick = () => {
            navigator.clipboard.writeText(resultsEl.textContent);
            statusEl.textContent = "Status: Timestamps copied to clipboard!";
        };
    </script>
</body>
</html>
